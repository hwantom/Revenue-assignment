<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BridgeOn Revenue Intelligence</title>
<meta name="description" content="BridgeOn Bank 글로벌 금융서비스 거래전표 100건 자동 정제·수익 분석 대시보드 (시뮬레이션 데이터)">
<style>
@font-face{font-family:"Pretendard BO";font-weight:100 900;font-display:swap;src:url(data:font/woff2;base64,/*__FONT__*/) format("woff2")}
:root{
  color-scheme:light;
  --page:#eef1f5; --surface:#ffffff; --surface-2:#f6f7f9; --chart:#fcfcfb;
  --ink:#0b0b0b; --ink-2:#4b5563; --muted:#8a8f98; --grid:#e5e7eb; --axis:#c3c2b7;
  --border:rgba(11,11,11,.09); --border-strong:rgba(11,11,11,.16);
  --navy:#0b1f3a; --navy-2:#13305a; --on-navy:#e9eef7; --on-navy-2:#9fb2cf;
  --accent:#2a78d6; --accent-soft:#e3eefb; --accent-ink:#1c5cab;
  --land:#dfe3e8; --land-active:#c6d8ee; --land-hover:#9ec5f4;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --c1:#e87ba4; --c2:#008300; --c3:#4a3aa7; --c4:#e34948;
  --up:#006300; --down:#b42318; --warn-bg:#fff6e0; --warn-ink:#8a5a00;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --radius:12px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0f12; --surface:#17191c; --surface-2:#1f2226; --chart:#1a1a19;
    --ink:#f4f5f7; --ink-2:#c3c7cf; --muted:#8b9099; --grid:#2c2f33; --axis:#3a3d42;
    --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16);
    --navy:#0a1424; --navy-2:#132642; --on-navy:#e9eef7; --on-navy-2:#8ea3c2;
    --accent:#3987e5; --accent-soft:#16283f; --accent-ink:#86b6ef;
    --land:#2a2e34; --land-active:#24405f; --land-hover:#256abf;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --c1:#d55181; --c2:#0ca30c; --c3:#9085e9; --c4:#e66767;
    --up:#0ca30c; --down:#f97066; --warn-bg:#2d2410; --warn-ink:#f5c35b;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0f12; --surface:#17191c; --surface-2:#1f2226; --chart:#1a1a19;
  --ink:#f4f5f7; --ink-2:#c3c7cf; --muted:#8b9099; --grid:#2c2f33; --axis:#3a3d42;
  --border:rgba(255,255,255,.08); --border-strong:rgba(255,255,255,.16);
  --navy:#0a1424; --navy-2:#132642; --on-navy:#e9eef7; --on-navy-2:#8ea3c2;
  --accent:#3987e5; --accent-soft:#16283f; --accent-ink:#86b6ef;
  --land:#2a2e34; --land-active:#24405f; --land-hover:#256abf;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --c1:#d55181; --c2:#0ca30c; --c3:#9085e9; --c4:#e66767;
  --up:#0ca30c; --down:#f97066; --warn-bg:#2d2410; --warn-ink:#f5c35b;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.45 "Pretendard BO",Pretendard,system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
a{color:var(--accent-ink)}

/* ---------- header ---------- */
.top{background:var(--navy);color:var(--on-navy);display:flex;align-items:center;gap:20px;padding:0 24px;height:56px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}
.brand-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#3987e5,#1baf7a);display:grid;place-items:center}
.brand b{font-weight:800;letter-spacing:.08em;font-size:15px}
.brand span{color:var(--on-navy-2);font-size:12px;letter-spacing:.14em;font-weight:600}
.tabs{display:flex;gap:2px;margin-left:8px;overflow-x:auto;scrollbar-width:none}
.tab{background:none;border:0;color:var(--on-navy-2);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;white-space:nowrap}
.tab:hover{color:var(--on-navy);background:rgba(255,255,255,.06)}
.tab[aria-selected="true"]{color:#fff;background:var(--navy-2)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:12px;white-space:nowrap}
.badge-sim{font-size:11px;font-weight:700;letter-spacing:.08em;color:#f5c35b;border:1px solid rgba(245,195,91,.45);padding:3px 8px;border-radius:999px}
.author{font-size:12px;color:var(--on-navy-2)}
.theme-btn{background:rgba(255,255,255,.08);border:0;color:var(--on-navy);width:30px;height:30px;border-radius:8px;cursor:pointer}

/* ---------- filters ---------- */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 24px;background:var(--surface);border-bottom:1px solid var(--border)}
.f{display:flex;align-items:center;gap:6px}
.f label{font-size:12px;color:var(--muted);font-weight:600}
.f select,.search{height:32px;border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:0 28px 0 10px}
.f select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 14px,calc(100% - 10px) 14px;background-size:5px 5px;background-repeat:no-repeat}
.search{padding:0 10px;min-width:220px}
.btn{height:32px;border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:0 12px;cursor:pointer;font-weight:600;font-size:13px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.filters .meta{margin-left:auto;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--ink-2);font-weight:600;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink)}

/* ---------- layout ---------- */
main{padding:12px 24px 24px}
.view{display:none}
.view.on{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.card-h{display:flex;align-items:baseline;gap:4px 10px;margin-bottom:10px;flex-wrap:wrap}
.card-h h2{font-size:12px;letter-spacing:.1em;font-weight:800;margin:0;color:var(--ink)}
.card-h .sub{font-size:12px;color:var(--muted)}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.hint{font-size:11px;color:var(--muted)}

.home{display:grid;gap:12px;grid-template-columns:repeat(12,minmax(0,1fr))}
.kpis{grid-column:1/-1;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.kpi{padding:9px 14px}
.kpi .k{font-size:11px;letter-spacing:.1em;font-weight:700;color:var(--muted)}
.kpi .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:4px;line-height:1.15}
.kpi .v small{font-size:14px;font-weight:700;margin-left:2px}
.kpi .s{font-size:12px;color:var(--ink-2);margin-top:4px}
.delta{font-weight:700}
.delta.up{color:var(--up)} .delta.down{color:var(--down)}
.map-card{grid-column:1/span 7}
.trend-card{grid-column:8/span 5}
.svc-card{grid-column:1/span 4}
.cust-card{grid-column:5/span 4}
.chan-card{grid-column:9/span 4}
.insight{grid-column:1/-1;display:flex;gap:14px;align-items:stretch;background:var(--navy);color:var(--on-navy);border-radius:var(--radius);padding:8px 16px;flex-wrap:wrap}
.insight .lab{font-weight:800;letter-spacing:.12em;font-size:12px;display:flex;align-items:center;padding-right:6px;color:#f5c35b}
.insight .it{flex:1 1 auto;border-left:1px solid rgba(255,255,255,.14);padding-left:14px;font-size:13px;line-height:1.5}
.insight .it b{color:#fff}

/* map */
.map-body{display:grid;grid-template-columns:minmax(0,1fr) 172px;gap:12px;align-items:start}
.map-wrap{position:relative}
.map-svg{width:100%;height:auto;max-height:196px;display:block;background:var(--chart);border-radius:8px}
.map-svg .land{fill:var(--land);stroke:var(--chart);stroke-width:.5}
.map-svg .land.active{fill:var(--land-active);cursor:pointer}
.map-svg .land.active:hover,.map-svg .land.hot{fill:var(--land-hover)}
.map-svg .arc{fill:none;stroke:var(--accent);stroke-linecap:round;opacity:.35;pointer-events:none}
.map-svg .bub{fill:var(--accent);fill-opacity:.82;stroke:var(--chart);stroke-width:2;cursor:pointer}
.map-svg .bub:hover,.map-svg .bub.hot{fill-opacity:1;stroke:var(--ink)}
.map-svg .bub-hit{fill:transparent;cursor:pointer}
.map-svg .lbl{font-size:15px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--chart);stroke-width:3px;stroke-linejoin:round;pointer-events:none}
.map-svg .lbl tspan.v{font-weight:600;fill:var(--ink-2)}
.map-svg .hq{fill:var(--navy);stroke:var(--chart);stroke-width:2}
.map-legend{display:flex;gap:16px;align-items:center;font-size:11px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.rank{display:grid;grid-template-columns:1fr;gap:0}
.rank button{padding:2px 6px}
.rank button{display:flex;gap:8px;align-items:center;border:0;background:none;padding:4px 6px;border-radius:6px;cursor:pointer;text-align:left;min-width:0}
.rank button:hover{background:var(--surface-2)}
.rank .n{color:var(--muted);font-size:11px;width:12px}
.rank .nm{font-weight:600;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .vv{margin-left:auto;font-size:12px;color:var(--ink-2)}

/* charts */
.chart-svg{display:block;width:100%;overflow:visible}
.chart-svg .gridline{stroke:var(--grid);stroke-width:1}
.chart-svg .axis{stroke:var(--axis);stroke-width:1}
.chart-svg .tick{font-size:11px;fill:var(--muted)}
.chart-svg .ttl{font-size:11px;font-weight:700;fill:var(--ink-2);letter-spacing:.04em}
.chart-svg .val{font-size:12px;font-weight:700;fill:var(--ink)}
.chart-svg .val2{font-size:11px;fill:var(--ink-2)}
.chart-svg .hit{fill:transparent;cursor:pointer}
.chart-svg .bar{cursor:pointer;transition:opacity .12s}
.chart-svg .bar:hover{opacity:.82}
.chart-svg .cross{stroke:var(--ink-2);stroke-width:1;stroke-dasharray:3 3}
.chart-svg .band{fill:var(--accent-soft)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.legend i.line{height:2px;width:14px;border-radius:1px;vertical-align:3px}

/* tooltip */
.tip{position:fixed;z-index:80;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--border-strong);box-shadow:0 8px 24px rgba(0,0,0,.14);border-radius:8px;padding:8px 10px;font-size:12px;min-width:150px;opacity:0;transition:opacity .08s}
.tip.on{opacity:1}
.tip .t{font-weight:700;margin-bottom:4px;color:var(--ink-2)}
.tip .r{display:flex;align-items:center;gap:8px;justify-content:space-between}
.tip .r span:first-child{color:var(--ink-2);display:flex;align-items:center;gap:6px}
.tip .r b{font-variant-numeric:tabular-nums}
.tip .key{display:inline-block;width:12px;height:2px;border-radius:1px}

/* tables */
.tbl-wrap{overflow:auto;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface-2);font-size:11px;letter-spacing:.04em;color:var(--ink-2);font-weight:700;z-index:1}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--ink)}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--accent-soft)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border)}
.flag{display:inline-block;width:18px;height:13.5px;border-radius:2px;vertical-align:-2px;margin-right:6px;box-shadow:0 0 0 1px var(--border-strong);object-fit:cover;flex:none}
.flag.lg{width:28px;height:21px;border-radius:3px;vertical-align:-3px;margin-right:8px}
.tip .t .flag{margin-right:6px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.chg{color:var(--accent-ink);font-weight:600}
.same{color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:12px;color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,12,24,.42);z-index:60;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(760px,100vw);background:var(--page);z-index:70;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.18)}
.drawer.on{transform:none}
.dr-h{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 18px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px}
.crumb{border:0;background:var(--surface-2);border-radius:6px;padding:4px 8px;cursor:pointer;color:var(--ink-2);font-weight:600}
.crumb .flag{width:14px;height:10.5px;margin-right:4px;vertical-align:-1px}
.crumb small{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--muted);font-weight:700}
.crumb.cur{background:var(--accent-soft);color:var(--accent-ink);cursor:default}
.crumbs .sep{color:var(--muted)}
.dr-title{display:flex;align-items:center;gap:10px;margin-top:10px}
.dr-title h3{margin:0;font-size:20px;letter-spacing:-.01em}
.dr-close{margin-left:auto;border:0;background:var(--surface-2);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:18px}
.dr-b{overflow:auto;padding:16px 18px 32px;display:grid;gap:14px}
.mini-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mini-kpis .card{padding:12px}
.mini-kpis .v{font-size:19px;font-weight:800;margin-top:2px}
.mini-kpis .k{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.mini-kpis .s{font-size:11px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.calc{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px}
.calc dt{color:var(--muted)}
.calc dd{margin:0;font-weight:600}
.eq{font-size:15px;font-weight:700;padding:10px 12px;background:var(--surface-2);border-radius:8px;margin:8px 0}
.raw-pre{margin:0;padding:14px;background:#0f172a;color:#e2e8f0;border-radius:10px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6;overflow:auto;white-space:pre}
.cmp{display:grid;grid-template-columns:1fr 26px 1fr;gap:0;font-size:13px}
.cmp .hd{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted);padding:6px 10px}
.cmp .o,.cmp .s2{padding:8px 10px;border-top:1px solid var(--border)}
.cmp .o{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--warn-bg);color:var(--warn-ink)}
.cmp .s2{font-weight:600;display:flex;align-items:flex-end}
.cmp .ar{display:grid;place-items:center;color:var(--muted);border-top:1px solid var(--border)}
.cmp .fld{display:block;font-size:10px;letter-spacing:.08em;color:var(--muted);font-weight:700;font-family:inherit}
.cmp .rl{display:block;font-size:10.5px;color:var(--muted);font-weight:500}

/* automation */
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.step{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;position:relative}
.step .no{font-size:11px;color:var(--accent-ink);font-weight:800;letter-spacing:.08em}
.step .nm{font-weight:700;margin:2px 0 6px}
.step .big{font-size:22px;font-weight:800}
.step .ds{font-size:11.5px;color:var(--ink-2)}
.step:not(:last-child)::after{content:"";position:absolute;right:-7px;top:50%;width:6px;height:6px;border-top:2px solid var(--muted);border-right:2px solid var(--muted);transform:translateY(-50%) rotate(45deg)}
.fmt3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.fmt3 .raw-pre{font-size:11.5px;max-height:240px}
.stack{display:grid;gap:14px}
.ok{color:var(--up);font-weight:800}
.callout{border-left:3px solid #f5c35b;background:var(--warn-bg);color:var(--ink);padding:12px 14px;border-radius:0 8px 8px 0;font-size:13px}
.callout b{color:var(--warn-ink)}
.kv{display:grid;grid-template-columns:160px 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
h4{margin:0 0 8px;font-size:13px}


/* ---------- LED ticker (은행·증권사 전광판) ---------- */
:root{--led-h:46px}
body{padding-bottom:var(--led-h)}
.led{position:fixed;left:0;right:0;bottom:0;height:var(--led-h);z-index:25;display:flex;align-items:stretch;background:#050505;border-top:2px solid #1c1c1c;box-shadow:0 -4px 18px rgba(0,0,0,.25);font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Pretendard BO",monospace;font-weight:700;letter-spacing:.06em;color:#ffb21e;user-select:none}
.led::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle at center,transparent 0 .9px,rgba(0,0,0,.55) 1.5px);background-size:3px 3px}
.led-tag{flex:none;display:flex;flex-direction:column;justify-content:center;padding:0 14px;border-right:2px solid #222;background:#0b0b0b;line-height:1.15;white-space:nowrap}
.led-tag b{font-size:14px;color:#ffb21e;text-shadow:0 0 6px rgba(255,178,30,.75)}
.led-tag span{font-size:10.5px;color:#9a8a5c;letter-spacing:.08em}
.led-view{position:relative;flex:1;overflow:hidden;display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent 0,#000 24px,#000 calc(100% - 24px),transparent)}
.led-track{display:inline-flex;align-items:center;white-space:nowrap;will-change:transform;animation:led-scroll var(--led-dur,60s) linear infinite}
.led:hover .led-track{animation-play-state:paused}
@keyframes led-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.led .it{display:inline-flex;align-items:center;gap:8px;font-size:16px;padding:0 4px}
.led .nm{color:#ffb21e;text-shadow:0 0 6px rgba(255,178,30,.7)}
.led .px{color:#f4f1e6;text-shadow:0 0 6px rgba(255,255,240,.55)}
.led .up{color:#ff3b30;text-shadow:0 0 7px rgba(255,59,48,.85)}
.led .dn{color:#2f9bff;text-shadow:0 0 7px rgba(47,155,255,.85)}
.led .eq{color:#bdb59c}
.led .sec{color:#050505;background:#ffb21e;padding:1px 7px;font-size:12px;letter-spacing:.1em;box-shadow:0 0 8px rgba(255,178,30,.6);margin:0 6px 0 18px}
.led .sep{color:#5a4a1e;margin:0 16px;font-size:12px}
.led .flag{width:20px;height:15px;margin:0;box-shadow:none;filter:saturate(1.2) brightness(1.1)}
@media (prefers-reduced-motion:reduce){.led-track{animation:none}.led-view{overflow-x:auto;mask-image:none}}

/* ---------- 미니 시각 요소 ---------- */
.spark{display:block;width:100%;height:24px;margin-top:4px;overflow:visible}
.kpi{position:relative}
.kpi-tag{position:absolute;top:10px;right:12px;font-size:11px;font-weight:700;color:var(--ink-2);background:var(--surface-2);border-radius:999px;padding:1px 7px}
.flags-row{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.flags-row .flag{margin:0;width:22px;height:16.5px}
.flags-row .off{opacity:.22;filter:grayscale(1)}
.mom-bars{display:grid;grid-template-columns:auto 1fr;gap:2px 6px;align-items:center;margin-top:4px;font-size:10.5px;color:var(--muted)}
.mom-bars i{display:block;height:7px;border-radius:2px}
.sbar{display:flex;height:10px;border-radius:3px;overflow:hidden;gap:2px;background:var(--surface-2)}
.sbar i{display:block;height:100%}
.ins{display:flex;align-items:center;gap:10px;flex:1 1 auto;border-left:1px solid rgba(255,255,255,.14);padding-left:14px;min-width:0}
.ins-v{flex:none;display:flex;align-items:center}
.ins-t{display:flex;flex-direction:column;line-height:1.2}
.ins-t b{font-size:15px;color:#fff;white-space:nowrap}
.ins-t small{font-size:11px;color:var(--on-navy-2);white-space:nowrap}
.ins .up{color:#ff6b61}.ins .dn{color:#6db3ff}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);white-space:nowrap}
.chip.raw{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.chip.std{font-weight:700;background:var(--accent-soft);color:var(--accent-ink);border-color:transparent}
.chip.tag{font-size:10.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-2);padding:2px 7px;border-radius:999px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.map-rows{display:grid;grid-template-columns:72px minmax(0,auto) 18px minmax(0,auto) 1fr;gap:8px 8px;align-items:center;font-size:12px}
.map-rows .fl{color:var(--muted);font-size:11px;font-weight:700}
.map-rows .ar{color:var(--muted);text-align:center}
.map-rows .tg{justify-self:end}
.eqs{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.eqb{background:var(--surface-2);border-radius:10px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;min-width:110px}
.eqb b{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.eqb small{font-size:11px;color:var(--muted);margin-top:2px}
.eqb.hl{background:var(--accent-soft)} .eqb.hl b{color:var(--accent-ink)}
.eqo{display:flex;align-items:center;font-size:20px;font-weight:700;color:var(--muted)}
.vt{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.vt>div{background:var(--surface-2);border-radius:10px;padding:12px;display:flex;align-items:center;gap:10px}
.vt .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:var(--up);flex:none}
.vt .ic.bad{background:var(--down)}
.vt b{font-size:20px;font-weight:800;display:block;line-height:1.1}
.vt small{font-size:11.5px;color:var(--muted)}
.fx-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.fx-grid>div{background:var(--surface-2);border-radius:10px;padding:10px 12px}
.fx-grid .c{font-size:11px;font-weight:800;letter-spacing:.06em;color:var(--ink-2)}
.fx-grid .q{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.06em;padding:6px 12px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface)}
.badge i{width:8px;height:8px;border-radius:50%;background:#f5a524;display:inline-block}
.badge.ok i{background:var(--up)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.legend.sm{font-size:11px;margin-top:4px}
.sbar-row{display:grid;grid-template-columns:52px 1fr;gap:8px;align-items:center;margin-bottom:8px;font-size:11.5px;color:var(--ink-2)}
.sbar-row .sbar{height:18px}
.sbar-row .sbar i{display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:#fff;overflow:hidden;white-space:nowrap}

/* ---------- AI 해설 패널 ---------- */
.ai-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:var(--on-navy);font-weight:700;font-size:12.5px;cursor:pointer;letter-spacing:.02em}
.ai-btn:hover{background:rgba(255,255,255,.12)}
.ai-btn .sw{width:26px;height:15px;border-radius:999px;background:rgba(255,255,255,.25);position:relative;transition:background .15s}
.ai-btn .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#fff;transition:transform .15s}
.ai-btn[aria-pressed="true"]{border-color:transparent;background:linear-gradient(135deg,#3987e5,#8b5cf6)}
.ai-btn[aria-pressed="true"] .sw{background:rgba(255,255,255,.45)}
.ai-btn[aria-pressed="true"] .sw::after{transform:translateX(11px)}
.ai-panel{position:fixed;left:0;top:56px;bottom:var(--led-h);width:min(400px,100vw);z-index:75;background:var(--surface);border-right:1px solid var(--border);box-shadow:10px 0 40px rgba(0,0,0,.16);transform:translateX(-105%);transition:transform .22s ease;display:flex;flex-direction:column}
.ai-panel.on{transform:none}
.ai-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
.ai-orb{width:30px;height:30px;border-radius:50%;background:conic-gradient(from 0deg,#3987e5,#8b5cf6,#1baf7a,#3987e5);display:grid;place-items:center;color:#fff;font-size:15px;flex:none}
.ai-panel.busy .ai-orb{animation:ai-spin 1s linear infinite}
@keyframes ai-spin{to{transform:rotate(360deg)}}
.ai-h b{font-size:14px}.ai-h small{display:block;font-size:11px;color:var(--muted)}
.ai-h button{margin-left:auto;border:0;background:var(--surface-2);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:17px}
.ai-b{flex:1;overflow:auto;padding:14px 16px 20px;display:grid;gap:14px;align-content:start}
.ai-sec h5{margin:0 0 6px;font-size:11px;letter-spacing:.12em;color:var(--accent-ink);font-weight:800}
.ai-sec p,.ai-sec li{font-size:13px;line-height:1.6;margin:0;color:var(--ink)}
.ai-sec ul{margin:0;padding-left:0;list-style:none;display:grid;gap:7px}
.ai-sec li{display:block;position:relative;padding-left:20px}
.ai-sec li::before{content:attr(data-i);position:absolute;left:0;top:2px;font-size:11px;font-weight:800;color:var(--accent-ink)}
.ai-sec.warn h5{color:var(--warn-ink)}
.ai-sec.act h5{color:var(--up)}
.ai-sec b{font-variant-numeric:tabular-nums}
.ai-reveal{opacity:0;transform:translateY(4px);animation:ai-in .32s ease forwards}
@keyframes ai-in{to{opacity:1;transform:none}}
.ai-typing{display:inline-flex;gap:4px;padding:6px 0}
.ai-typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:ai-dot 1s infinite}
.ai-typing i:nth-child(2){animation-delay:.15s}.ai-typing i:nth-child(3){animation-delay:.3s}
@keyframes ai-dot{0%,80%,100%{opacity:.25}40%{opacity:1}}
.ai-foot{font-size:10.5px;color:var(--muted);padding:10px 16px;border-top:1px solid var(--border)}
@media (prefers-reduced-motion:reduce){.ai-reveal{animation:none;opacity:1;transform:none}.ai-panel.busy .ai-orb{animation:none}}
@media (max-width:1180px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .map-card,.trend-card{grid-column:1/-1}
  .map-body{grid-template-columns:1fr}
  .rank{grid-template-columns:repeat(4,minmax(0,1fr))}
  .svc-card,.cust-card,.chan-card{grid-column:span 6}
  .chan-card{grid-column:1/-1}
  .pipe{grid-template-columns:repeat(4,minmax(0,1fr))}
  .step::after{display:none}
  .fmt3{grid-template-columns:1fr}
  .fx-grid,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:720px){
  .ai-btn .lbl{display:none}
  .ai-panel{top:0;z-index:90}
  .led-tag span{display:none}
  .led .it{font-size:14px}
  .top{padding:0 16px;gap:10px;height:auto;flex-wrap:wrap;padding-top:8px;padding-bottom:6px}
  .brand span,.author{display:none}
  .tabs{order:3;width:100%;margin:0}
  .filters,main{padding-left:16px;padding-right:16px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .svc-card,.cust-card,.chan-card{grid-column:1/-1}
  .rank{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mini-kpis,.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .pipe{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kv{grid-template-columns:110px 1fr}
  .map-rows{grid-template-columns:60px minmax(0,1fr) 14px minmax(0,1fr)}
  .map-rows .tg{display:none}
  .vt{grid-template-columns:1fr}
  .search{min-width:0;width:100%}
}

/* ===== Finity 스타일 테마: 라벤더 캔버스 · 둥근 흰 카드 · 보라 포인트 ===== */
:root{
  --page:#f3f2f8; --surface:#ffffff; --surface-2:#f6f5fb; --chart:#ffffff;
  --ink:#1d1b2e; --ink-2:#5d5a75; --muted:#9b98ae; --grid:#efeef5; --axis:#dddbe8;
  --border:rgba(29,27,46,.06); --border-strong:rgba(29,27,46,.12);
  --accent:#7b61ff; --accent-soft:#efebff; --accent-ink:#5a3ee6; --accent-2:#2ec4b6;
  --land:#e9e8f1; --land-active:#ddd6ff; --land-hover:#b9a9ff;
  --s1:#7b61ff; --s2:#f08a4b; --s3:#1fb5a6; --s4:#d99a00;
  --c1:#e26ca6; --c2:#3fa9f5; --c3:#3f37c9; --c4:#f0616d;
  --shadow:0 1px 2px rgba(29,27,46,.03),0 6px 24px rgba(29,27,46,.05);
  --radius:20px; --top-h:64px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#0f0e17; --surface:#1b1a26; --surface-2:#242333; --chart:#1b1a26;
    --ink:#f3f2fa; --ink-2:#c4c1d6; --muted:#8c89a3; --grid:#2a2938; --axis:#3a3850;
    --border:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.13);
    --accent:#9b87ff; --accent-soft:#2a2445; --accent-ink:#c2b6ff; --accent-2:#2ec4b6;
    --land:#2a2938; --land-active:#3b3266; --land-hover:#6d5bd6;
    --s1:#7d63f5; --s2:#d9692e; --s3:#1a9e90; --s4:#c98500;
    --c1:#d55181; --c2:#2f8fd8; --c3:#5a4ccc; --c4:#e05a5a;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --page:#0f0e17; --surface:#1b1a26; --surface-2:#242333; --chart:#1b1a26;
  --ink:#f3f2fa; --ink-2:#c4c1d6; --muted:#8c89a3; --grid:#2a2938; --axis:#3a3850;
  --border:rgba(255,255,255,.06); --border-strong:rgba(255,255,255,.13);
  --accent:#9b87ff; --accent-soft:#2a2445; --accent-ink:#c2b6ff; --accent-2:#2ec4b6;
  --land:#2a2938; --land-active:#3b3266; --land-hover:#6d5bd6;
  --s1:#7d63f5; --s2:#d9692e; --s3:#1a9e90; --s4:#c98500;
  --c1:#d55181; --c2:#2f8fd8; --c3:#5a4ccc; --c4:#e05a5a;
  --shadow:none;
}
body{background:var(--page)}
/* 헤더: 흰 바탕 · 가운데 알약 탭 · 프로필 칩 */
.top{background:var(--surface);color:var(--ink);height:var(--top-h);border-bottom:1px solid var(--border);gap:16px;padding:0 28px}
.brand-mark{width:34px;height:34px;border-radius:50%;background:var(--accent)}
.brand b{font-size:16px;letter-spacing:-.01em;font-weight:800}
.brand span{color:var(--muted);font-size:11.5px;letter-spacing:.02em;font-weight:600;display:block;margin-top:-1px}
.tabs{margin:0 auto;gap:8px}
.tab{color:var(--ink-2);border:1px solid var(--border-strong);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;background:var(--surface);transition:all .15s}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab[aria-selected="true"]{color:var(--accent-ink);background:var(--accent-soft);border-color:transparent}
.top-right{gap:10px}
.badge-sim{color:#9a6700;background:#fff4d6;border:0;padding:4px 10px;letter-spacing:.06em}
:root[data-theme="dark"] .badge-sim{color:#f5c35b;background:#3a2f12}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge-sim{color:#f5c35b;background:#3a2f12}}
.icon-btn,.theme-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
.theme-btn:hover{background:var(--surface-2)}
.ai-btn{height:36px;border-color:var(--border-strong);background:var(--surface);color:var(--ink)}
.ai-btn:hover{background:var(--surface-2)}
.ai-btn .sw{background:var(--axis)}
.ai-btn[aria-pressed="true"]{background:linear-gradient(135deg,#7b61ff,#a78bfa);color:#fff}
.profile{display:flex;align-items:center;gap:9px;padding:4px 12px 4px 4px;border:1px solid var(--border-strong);border-radius:999px}
.profile .av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#ff7a45,#ff9f6b);color:#fff;font-weight:800;display:grid;place-items:center;font-size:13px}
.profile b{display:block;font-size:12.5px;line-height:1.15}
.profile small{display:block;font-size:10.5px;color:var(--muted)}
/* 페이지 제목 + 필터 알약 */
.filters{background:transparent;border:0;padding:12px 28px 2px;gap:10px}
.ptitle{margin:0 12px 0 0;font-size:21px;font-weight:800;letter-spacing:-.02em}
.fctrl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-left:auto}
.f label{display:none}
.f select{height:36px;border-radius:999px;border:1px solid var(--border-strong);background-color:var(--surface);padding:0 32px 0 14px;font-weight:600;font-size:13px;background-position:calc(100% - 17px) 16px,calc(100% - 12px) 16px}
.search{height:36px;border-radius:999px;padding:0 14px}
.btn{height:36px;border-radius:999px;padding:0 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent)}
.filters .meta{margin-left:0;font-weight:700;color:var(--accent-ink);background:var(--accent-soft);padding:7px 12px;border-radius:999px}
main{padding:10px 28px 20px}
/* 카드 */
.card{border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px}
.kpi{padding:11px 16px}
.flags-row{gap:4px;flex-wrap:nowrap}.flags-row .flag{width:20px;height:15px}
.card-h h2{font-size:14px;letter-spacing:-.005em;font-weight:700}
.card-h{margin-bottom:8px}
.seg{border-radius:999px;border-color:var(--border-strong);padding:2px;gap:2px}
.seg button{border-radius:999px;padding:4px 11px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.home,.kpis{gap:12px}
.kpi .k{font-size:12.5px;letter-spacing:0;font-weight:600;color:var(--ink-2)}
.kpi .v{font-size:23px}
.kpi-tag{background:var(--accent-soft);color:var(--accent-ink)}
.map-svg{background:var(--surface-2);border-radius:16px}
.map-svg .land{stroke:var(--surface-2)}
.map-svg .bub{fill:var(--accent);stroke:#fff}
.map-svg .lbl{stroke:var(--surface-2)}
.rank button{border-radius:10px}
/* 인사이트: 보라 그라데이션 카드 */
.insight{background:linear-gradient(115deg,#5b3fe6 0%,#7b61ff 45%,#a48dff 100%);border-radius:var(--radius);box-shadow:0 10px 28px rgba(123,97,255,.25);padding:10px 18px}
.insight .lab{color:rgba(255,255,255,.85)}
.ins{border-left-color:rgba(255,255,255,.22)}
.ins-t small{color:rgba(255,255,255,.75)}
.ins .up{color:#fff}
/* 표 · 드로어 · 기타 */
.tbl-wrap{border-radius:14px}
th{background:var(--surface-2);letter-spacing:0;font-size:11.5px}
tbody tr.click:hover{background:var(--accent-soft)}
.drawer{border-radius:24px 0 0 24px;overflow:hidden}
.dr-h{border-bottom:0;padding:18px 20px 10px}
.crumb{border-radius:999px;padding:5px 11px}
.crumb small{display:inline;margin-right:5px}
.dr-close{border-radius:50%}
.pill{background:var(--accent-soft);color:var(--accent-ink);border:0}
.chip{border-radius:999px}
.chip.raw,.chip.std{border-radius:8px}
.eqb{border-radius:14px}
.vt>div,.fx-grid>div{border-radius:14px}
.badge{border:0;background:var(--surface);box-shadow:var(--shadow)}
.step{border-radius:16px}
.raw-pre{border-radius:14px;background:#17152a}
.ai-panel{top:var(--top-h);border-radius:0 24px 24px 0;overflow:hidden}
.ai-orb{background:conic-gradient(from 0deg,#7b61ff,#b49bff,#2ec4b6,#7b61ff)}
.ai-sec h5{color:var(--accent-ink)}
.tip{border-radius:12px;border-color:var(--border)}
@media (max-width:1180px){.tabs{margin:0}}
@media (max-width:720px){
  .top{padding:8px 16px;height:auto}
  .profile small,.profile b{display:none}.profile{padding:3px}
  .filters{padding:14px 16px 4px}.ptitle{width:100%}
  .fctrl{margin-left:0}
  .flags-row{flex-wrap:wrap}
  .tab{padding:6px 12px;font-size:12.5px}
  main{padding:10px 16px 20px}
}

/* ===== 스킨: blue(기본) · lavender · navy — 라이트/다크 ===== */
:root{--surface:#ffffff;--chart:#ffffff;--border:rgba(25,31,40,.06);--border-strong:rgba(25,31,40,.12);--shadow:0 1px 2px rgba(25,31,40,.04),0 6px 20px rgba(25,31,40,.05);--page:#f2f4f6;--surface-2:#f6f7f9;--track:#eef0f3;--ink:#191f28;--ink-2:#4e5968;--muted:#6b7684;--grid:#eef0f3;--axis:#d1d6db;--accent:#3182f6;--accent-soft:#e8f3ff;--accent-ink:#1b64da;--accent-2:#14b8a6;--land:#e5e8eb;--land-active:#cfe3ff;--land-hover:#90c2ff;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#d99a00;--c1:#e87ba4;--c2:#008300;--c3:#4a3aa7;--c4:#e34948;--hero:linear-gradient(115deg,#1b64da 0%,#3182f6 55%,#5ca3ff 100%);--hero-shadow:0 10px 28px rgba(49,130,246,.25);}
:root[data-skin="lavender"]{--surface:#ffffff;--chart:#ffffff;--border:rgba(25,31,40,.06);--border-strong:rgba(25,31,40,.12);--shadow:0 1px 2px rgba(25,31,40,.04),0 6px 20px rgba(25,31,40,.05);--page:#f3f2f8;--surface-2:#f6f5fb;--track:#efeef6;--ink:#1d1b2e;--ink-2:#4f4c66;--muted:#706d86;--grid:#efeef5;--axis:#dddbe8;--accent:#7b61ff;--accent-soft:#efebff;--accent-ink:#5a3ee6;--accent-2:#2ec4b6;--land:#e9e8f1;--land-active:#ddd6ff;--land-hover:#b9a9ff;--s1:#7b61ff;--s2:#f08a4b;--s3:#1fb5a6;--s4:#d99a00;--c1:#e26ca6;--c2:#3fa9f5;--c3:#3f37c9;--c4:#f0616d;--hero:linear-gradient(115deg,#5b3fe6 0%,#7b61ff 45%,#a48dff 100%);--hero-shadow:0 10px 28px rgba(123,97,255,.25);}

/* 가독성: 글자 크기·대비 */
body{font-size:14.5px}
.card-h h2{font-size:15px}
.chart-svg .tick{font-size:12px;fill:var(--muted)}

.chart-svg .ttl{font-size:12px;fill:var(--ink-2)}

.map-svg .lbl{font-size:19px}

/* 막대 목록 (한 줄: 이름 · 막대 · 값) */

.brow{display:grid;grid-template-columns:var(--lw,96px) minmax(0,1fr) auto;align-items:center;gap:12px;padding:6px 8px;border-radius:10px}
.brow.click{cursor:pointer}
.brow.click:hover{background:var(--surface-2)}
.brow .bl{font-size:13px;font-weight:600;color:var(--ink);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.brow .bl .flag{margin:0}
.bt{height:10px;border-radius:999px;background:var(--track);overflow:hidden;display:grid;gap:3px}
.bt i{display:block;height:100%;border-radius:999px;min-width:3px}
.bt.two{height:auto;background:none;gap:4px}
.bt.two span{display:block;height:8px;border-radius:999px;background:var(--track);overflow:hidden}
.bt.two span i{height:8px}
.brow .bv{text-align:right;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.brow .bv small{font-size:12px;font-weight:600;color:var(--muted);margin-left:6px}

.skins{display:flex;gap:6px;align-items:center;padding:0 4px}
.skins button{width:18px;height:18px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border-strong);cursor:pointer;padding:0}
.skins button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
@media (max-width:720px){.skins{display:none}}

/* ===== 보고용 홈: 결론 → 근거 ===== */

.ptitle{margin:0}
.psub{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.psub b{color:var(--ink)}
.home{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.summary{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:center;background:var(--hero);box-shadow:var(--hero-shadow);color:#fff;border:0;padding:12px 22px}
.summary .lab{font-size:11.5px;font-weight:800;letter-spacing:.12em;opacity:.8}
.summary .bl{font-size:17.5px;font-weight:700;line-height:1.45;margin-top:4px;letter-spacing:-.01em}
.summary .bl b{font-weight:800;background:rgba(255,255,255,.18);padding:0 5px;border-radius:5px;white-space:nowrap}
.sum-k{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.sum-k>div{background:rgba(255,255,255,.13);border-radius:14px;padding:9px 12px}
.sum-k .k{font-size:11.5px;opacity:.85}
.sum-k .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2;margin-top:2px}
.sum-k .d{font-size:11.5px;font-weight:700;opacity:.95}
.msg{display:flex;flex-direction:column;min-width:0}
.msg-h{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.msg-no{width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;font-size:12.5px;margin-top:1px}
.msg-tx{min-width:0;flex:1}
.msg-t{font-size:16.5px;font-weight:800;line-height:1.35;letter-spacing:-.01em;color:var(--ink)}
.msg-t em{font-style:normal;color:var(--accent-ink);white-space:nowrap}
.msg-s{font-size:12.5px;color:var(--ink-2);margin-top:2px;line-height:1.45}
.msg-tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);background:var(--surface-2);padding:3px 9px;border-radius:999px;white-space:nowrap}
.msg-b{flex:1;min-height:0}
.msg-2col{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:18px;align-items:start}
.mob-h{font-size:12px;font-weight:700;color:var(--ink-2);margin:6px 8px 4px}
.up-t{color:var(--up)}.dn-t{color:var(--down)}
@media (max-width:1180px){.home{grid-template-columns:1fr}.summary{grid-template-columns:1fr}.msg-2col{grid-template-columns:1fr}}

.profile .av{width:34px;height:34px;overflow:hidden}
.profile .av img{width:100%;height:100%;object-fit:cover;display:block}

// ---------- TREND (small multiples: 거래액 / 수익, 공통 X축) ----------
function renderTrend() {
  const host = $("#trend"), W = Math.max(300, host.clientWidth || 480);
  const base = baseRows(), sel = new Set(periodMonths());
  const byM = MONTHS.map(m => agg(base.filter(s => s.Month === m)));
  const H1 = 74, gap = 18, padL = 46, padR = 12, padT = 18, padB = 22;
  const H = padT + H1 + gap + H1 + padB;
  const el = svg("svg", {class: "chart-svg", viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": "월별 거래액과 수익 추이"});
  const x = i => padL + (W - padL - padR) * (i / (MONTHS.length - 1));
  const step = (W - padL - padR) / (MONTHS.length - 1);
  // 선택 기간 강조
  const idx = MONTHS.map((m, i) => sel.has(m) ? i : -1).filter(i => i >= 0);
  if (idx.length < MONTHS.length) svg("rect", {class: "band", x: x(idx[0]) - step/2, y: padT - 6, width: step * idx.length, height: H1*2 + gap + 6, rx: 6}, el);
  const panels = [["거래액", "krw", "var(--accent)", padT], ["수익", "rev", "var(--accent-2)", padT + H1 + gap]];
  for (const [title, key, color, top] of panels) {
    const vals = byM.map(a => a[key]);
    const nice = niceMax(Math.max(...vals, 1));
    const y = v => top + H1 - (v / nice) * H1;
    for (let k = 0; k <= 2; k++) {
      const v = nice * k / 2, yy = y(v);
      svg("line", {class: k === 0 ? "axis" : "gridline", x1: padL, x2: W - padR, y1: yy, y2: yy}, el);
      const t = svg("text", {class: "tick num", x: padL - 6, y: yy + 4, "text-anchor": "end"}, el); t.textContent = shortWon(v);
    }
    const tt = svg("text", {class: "ttl", x: padL, y: top - 6}, el); tt.textContent = title;
    const pts = vals.map((v, i) => [x(i), y(v)]);
    const line = smoothD(pts);
    svg("path", {d: `${line} L${pts[pts.length-1][0]},${top + H1} L${pts[0][0]},${top + H1} Z`, fill: svgGrad(el, color, .38)}, el);
    svg("path", {d: line, fill: "none", stroke: color, "stroke-width": 2.4, "stroke-linejoin": "round", "stroke-linecap": "round"}, el);
    pts.forEach((p, i) => { if (sel.has(MONTHS[i]) && sel.size < MONTHS.length) svg("circle", {cx: p[0], cy: p[1], r: 3.5, fill: color, stroke: "var(--surface)", "stroke-width": 2}, el); });
    // 최대값 직접 표시
    const mi = vals.indexOf(Math.max(...vals));
    const lv = svg("text", {class: "val num", x: Math.min(Math.max(pts[mi][0], padL + 30), W - padR - 30), y: pts[mi][1] - 8, "text-anchor": "middle"}, el); lv.textContent = won(vals[mi]);
  }
  MONTHS.forEach((m, i) => { const t = svg("text", {class: "tick", x: x(i), y: H - 4, "text-anchor": "middle"}, el); t.textContent = `${+m.slice(5)}월`; });
  // crosshair
  const cross = svg("line", {class: "cross", y1: padT - 6, y2: padT + H1*2 + gap, visibility: "hidden"}, el);
  MONTHS.forEach((m, i) => {
    const hit = svg("rect", {class: "hit", x: x(i) - step/2, y: 0, width: step, height: H - padB}, el);
    hit.setAttribute("aria-label", `${+m.slice(5)}월`);
    hit.addEventListener("pointerenter", () => { cross.setAttribute("x1", x(i)); cross.setAttribute("x2", x(i)); cross.setAttribute("visibility", "visible"); });
    hit.addEventListener("pointerleave", () => cross.setAttribute("visibility", "hidden"));
    const prev = byM[i-1];
    bindTip(hit, `2026년 ${+m.slice(5)}월`, () => [["거래액", won(byM[i].krw), "var(--accent)"], ["수익", won(byM[i].rev), "var(--accent-2)"], ["건수", `${byM[i].cnt}건`], ["전월 대비 거래액", prev && prev.krw ? `${((byM[i].krw/prev.krw - 1)*100).toFixed(1)}%` : "–"]], () => openDrill([{dim: "Month", value: m}]));
  });

}
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 1.2, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (m * p >= v) return m * p; return 10 * p; }

function hbars(host, items, opts = {}) {

function monthBars(host, rows) {
  const W = Math.max(280, host.clientWidth || 600), H = 150, padL = 44, padR = 6, padT = 18, padB = 20;
  const el = svg("svg", {class: "chart-svg", viewBox: `0 0 ${W} ${H}`, height: H});
  const by = MONTHS.map(m => rows.filter(r => r.Month === m));
  const vals = by.map(r => sum(r, "KRW_Amount")), nice = niceMax(Math.max(...vals, 1));
  const bw = (W - padL - padR) / MONTHS.length, ch = H - padT - padB;
  [0, .5, 1].forEach(v => { const yy = padT + ch * (1 - v); svg("line", {class: v === 0 ? "axis" : "gridline", x1: padL, x2: W - padR, y1: yy, y2: yy}, el); const t = svg("text", {class: "tick num", x: padL - 6, y: yy + 4, "text-anchor": "end"}, el); t.textContent = shortWon(nice * v); });
  MONTHS.forEach((m, i) => {
    const h = ch * vals[i] / nice, x = padL + i * bw + bw * .2, w = bw * .6;
    if (vals[i] > 0) svg("path", {d: roundTop(x, padT + ch - h, w, h, 3), fill: "var(--accent)", class: "bar"}, el);

  });

function roundTop(x, y, w, h, r) { r = Math.min(r, h, w/2); return `M${x},${y+h} V${y+r} Q${x},${y} ${x+r},${y} H${x+w-r} Q${x+w},${y} ${x+w},${y+r} V${y+h} Z`; }

const CMP_FIELDS = [["date","Date","거래일"],["service","Service","서비스"],["customer","Customer_Type","고객유형"],["country","Country","국가"],["currency","Currency","통화"],["channel","Channel","채널"],["amount","Foreign_Amount","외화금액"],["tenor","Tenor_Days","여신기간"]];

// TRANSACTION 단계: 값만 보여 준다 (설명은 마지막 RAW SLIP 단계에서)
function renderTxnView(s) {
  $("#drTitle").textContent = s.Transaction_ID;
  $("#drBadges").innerHTML = `<span class="pill">${flagHtml(s.Country)}${esc(CTRY[s.Country].ko)}</span> <span class="pill">${SVC_KO[s.Service]}</span>`;
  const body = $("#drBody"); body.replaceChildren();
  const k = document.createElement("div"); k.className = "mini-kpis";
  k.innerHTML = [["원화 거래액", won(s.KRW_Amount), fmtAmt(s.Foreign_Amount, s.Currency)], ["총 수익", won(s.Total_Revenue), pct(s.Revenue_Rate / 100, 3)], ["국가", flagHtml(s.Country, "lg") + esc(CTRY[s.Country].ko), s.Date], ["고객 · 채널", CUST_KO[s.Customer_Type], CHAN_KO[s.Channel]]]
    .map(([kk, v, sub]) => `<div class="card"><div class="k">${kk}</div><div class="v num">${v}</div><div class="s">${sub}</div></div>`).join("");
  body.appendChild(k);
  const cmp = document.createElement("div"); cmp.className = "card";
  const rows = rawFields(s).map(([rk, sk, ko]) =>
    `<div class="o"><span class="fld">${esc(ko)}</span>${esc(String(s.Raw[rk]))}</div><div class="ar">→</div><div class="s2">${esc(stdValue(s, sk))}</div>`).join("");
  cmp.innerHTML = `<div class="card-h"><h2>원본 ↔ 표준값</h2><div class="right"><button class="btn primary" id="toRaw">원본 전표 →</button></div></div>
    <div class="cmp"><div class="hd">ORIGINAL</div><div></div><div class="hd">STANDARDIZED</div>${rows}</div>`;
  body.appendChild(cmp);
  $("#toRaw", cmp).addEventListener("click", () => pushDrill({raw: s.Source_File}));
}

// RAW SLIP 단계 (마지막): 원본 파일 + 정제·계산 과정을 그림으로
const RULE_KO = {R00_DEDUP: "중복", R01_DATE: "날짜", R02_SERVICE: "서비스", R03_CUSTOMER: "고객", R04_COUNTRY: "국가", R05_CHANNEL: "채널", R06_CURRENCY: "통화", R07_AMOUNT: "금액·단위", R08_TYPO: "오탈자", R09_FX_JOIN: "환율일", R10_REVENUE: "수익"};
function renderRawView(file) {
  const raw = RAW_BY_FILE[file], s = BY_ID[raw.transaction_id];
  $("#drTitle").textContent = file.split("/").pop();
  $("#drBadges").innerHTML = `<span class="pill">${esc(SYS_KO[raw.system])} · ${esc(raw.format)}</span>`;
  const body = $("#drBody"); body.replaceChildren();
  const dups = DATA.summary.pipeline.duplicates.filter(d => d.duplicate_of === file);
  const ruleDesc = Object.fromEntries(DATA.rules.map(r => [r.id, r.rule]));

  const card = document.createElement("div"); card.className = "card";
  card.innerHTML = `<div class="card-h"><h2>원본 전표</h2><div class="right"><a class="btn" style="display:inline-flex;align-items:center;text-decoration:none" href="${esc(file)}" target="_blank" rel="noopener">파일 열기</a></div></div>`;
  const pre = document.createElement("pre"); pre.className = "raw-pre"; pre.textContent = raw.text; card.appendChild(pre);
  const meta = document.createElement("div"); meta.className = "chips"; meta.style.marginTop = "10px";
  meta.innerHTML = `<span class="chip mono">${esc(s ? s.Source_Ref : "-")}</span><span class="same">→</span><span class="chip std mono">${esc(raw.transaction_id || "-")}</span>` +
    dups.map(d => `<span class="chip tag" title="${esc(ruleDesc.R00_DEDUP)}">✕ ${esc(d.file.split("/").pop())} 중복 제거</span>`).join("");
  card.appendChild(meta);
  body.appendChild(card);
  if (!s) return;

  // 원문 → 표준값 (규칙 태그에 마우스를 올리면 규칙 설명)
  const logs = LOG_BY_FILE[file] || [];
  const cl = document.createElement("div"); cl.className = "card";
  cl.innerHTML = `<div class="card-h"><h2>정제 과정</h2></div><div class="map-rows">${rawFields(s).map(([rk, sk, ko]) => {
    const l = logs.find(x => x.field === sk);
    const tip = l ? (l.rule === "R01_DATE" ? `${l.note} → YYYY-MM-DD` : (l.note || ruleDesc[l.rule] || "")) : "";
    const std = sk === "Country" ? flagHtml(s.Country) + esc(s.Country) : sk === "Service" ? `<span class="dot" style="background:${SVC_COLOR[s.Service]}"></span>${esc(s.Service)}` : esc(stdValue(s, sk));
    return `<span class="fl">${esc(ko)}</span><span class="chip raw">${esc(String(s.Raw[rk]))}</span><span class="ar">${l ? "→" : "="}</span><span class="chip std">${std}</span><span class="tg">${l ? `<span class="chip tag" title="${esc(tip)}">${RULE_KO[l.rule] || esc(l.rule)}</span>` : ""}</span>`;
  }).join("")}</div>`;
  body.appendChild(cl);

  // 계산: 외화 × 환율 = 원화, 수익 구성
  const fxDate = s.FX_Rate_Date.slice(5).replace("-", "/") + (s.FX_Rate_Date !== s.Date ? " ↶" : "");
  const parts = [[s.Fee, "var(--s2)", "수수료"], [s.FX_Revenue, "var(--s1)", "외환"], [s.Finance_Revenue, "var(--s4)", "금융"]];
  const calc = document.createElement("div"); calc.className = "card";
  calc.innerHTML = `<div class="card-h"><h2>계산 과정</h2><div class="right">${DATA.fx_meta.source === "SIMULATED" ? '<span class="chip tag">SIM 환율</span>' : '<span class="chip tag">ECOS</span>'}<span class="chip tag" title="${esc(DATA.policy.basis)}">가상 정책</span></div></div>
    <div class="eqs">
      <div class="eqb"><b>${esc(s.Foreign_Amount.toLocaleString("en-US"))}</b><small>${esc(s.Currency)}</small></div><div class="eqo">×</div>
      <div class="eqb" title="${s.FX_Quote_Unit !== 1 ? esc(`${s.FX_Quote.toLocaleString()}원 / ${s.FX_Quote_Unit} ${s.Currency}`) : ""}${s.FX_Rate_Date !== s.Date ? esc(` · 직전 고시일 ${s.FX_Rate_Date}`) : ""}"><b>${s.FX_Rate.toLocaleString(undefined, {maximumFractionDigits: 4})}</b><small>₩ · ${esc(fxDate)}</small></div><div class="eqo">=</div>
      <div class="eqb hl"><b>₩${n0(s.KRW_Amount)}</b><small>KRW</small></div>
    </div>
    <div style="margin-top:14px">${stackBar(parts, "sbar", false).replace('class="sbar"', 'class="sbar" style="height:14px"')}
      <div class="legend sm">${parts.map(([v, c, l]) => `<span><i style="background:${c}"></i>${l} <b class="num">${n0(v)}</b></span>`).join("")}<span style="margin-left:auto"><b class="num" style="color:var(--accent-ink)">₩${n0(s.Total_Revenue)}</b> · ${s.Revenue_Rate.toFixed(3)}%</span></div>
    </div>
    <div class="chips" style="margin-top:10px">${s.Revenue_Steps.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>`;
  body.appendChild(calc);
}

// ---------- LEDGER ----------
const LEDGER_COLS = [["Transaction_ID","거래번호"],["Date","일자"],["Service","서비스"],["Customer_Type","고객"],["Country","국가"],["Currency","통화"],["Foreign_Amount","외화금액","r"],["FX_Rate","적용환율","r"],["KRW_Amount","원화 거래액","r"],["Total_Revenue","수익","r"],["Revenue_Rate","수익률","r"],["Channel","채널"],["Source_File","원본 파일"]];
function renderLedger() {
  const q = state.ledgerQ.trim().toLowerCase();
  let rows = rowsNow().filter(s => !q || [s.Transaction_ID, s.Country, CTRY[s.Country].ko, s.Currency, s.Service, SVC_KO[s.Service], s.Source_File, s.Source_Ref].join(" ").toLowerCase().includes(q));
  const [key, dir] = state.ledgerSort;
  rows.sort((a, b) => (a[key] > b[key] ? 1 : a[key] < b[key] ? -1 : 0) * dir);
  $("#ledgerSub").textContent = `${rows.length}건 · 거래액 ${won(sum(rows, "KRW_Amount"))} · 수익 ${won(sum(rows, "Total_Revenue"))}`;
  const t = $("#ledger");
  t.innerHTML = `<thead><tr>${LEDGER_COLS.map(([k, l, c]) => `<th class="sortable ${c || ""}" data-k="${k}">${l}${key === k ? (dir > 0 ? " ▲" : " ▼") : ""}</th>`).join("")}</tr></thead>`;
  const tb = document.createElement("tbody");
  for (const s of rows) {
    const tr = document.createElement("tr"); tr.className = "click"; tr.tabIndex = 0;
    tr.innerHTML = `<td class="mono">${s.Transaction_ID}</td><td class="num">${s.Date}</td><td><span class="dot" style="background:${SVC_COLOR[s.Service]}"></span>${SVC_KO[s.Service]}</td><td>${CUST_KO[s.Customer_Type]}</td><td>${flagHtml(s.Country)}${esc(CTRY[s.Country].ko)}</td><td>${s.Currency}</td><td class="r num">${s.Foreign_Amount.toLocaleString("en-US")}</td><td class="r num">${s.FX_Rate.toLocaleString(undefined, {maximumFractionDigits: 4})}</td><td class="r num">${n0(s.KRW_Amount)}</td><td class="r num">${n0(s.Total_Revenue)}</td><td class="r num">${s.Revenue_Rate.toFixed(3)}%</td><td>${CHAN_KO[s.Channel]}</td><td class="mono">${esc(s.Source_File.replace("raw_slips/", ""))}</td>`;
    const go = () => openDrill([{txn: s.Transaction_ID}]);
    tr.addEventListener("click", go); tr.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    tb.appendChild(tr);
  }
  t.appendChild(tb);
  t.querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => { const k = th.dataset.k; state.ledgerSort = [k, state.ledgerSort[0] === k ? -state.ledgerSort[1] : (["KRW_Amount","Total_Revenue","Foreign_Amount","Revenue_Rate"].includes(k) ? -1 : 1)]; renderLedger(); }));
}

// ---------- PIPELINE: 흐름도 + 막대 + 체크 타일 ----------
function renderPipeline() {
  const P = DATA.summary.pipeline, V = DATA.validation;
  const ruleCount = r => DATA.log.filter(l => l.rule === r).length;
  const SYS_COL = {BRANCH: "var(--c3)", DIGITAL: "var(--c1)", CORP: "var(--c4)"};
  const fmtCnt = sys => DATA.raw.filter(r => r.system === sys).length;
  const sameDay = S.filter(x => x.FX_Rate_Date === x.Date).length;
  // 흐름도: 열마다 누적 막대, 열 사이를 띠로 연결
  const cols = [
    {t: "수집", n: P.collected, u: "files", segs: [["BRANCH", fmtCnt("BRANCH"), SYS_COL.BRANCH, "TXT"], ["DIGITAL", fmtCnt("DIGITAL"), SYS_COL.DIGITAL, "JSON"], ["CORP", fmtCnt("CORP"), SYS_COL.CORP, "CSV"]]},
    {t: "중복 제거", n: P.deduplicated, u: `−${P.duplicates.length}`, segs: [["k", P.deduplicated, "var(--accent)", ""], ["x", P.duplicates.length, "var(--axis)", "✕"]]},
    {t: "표준화", n: P.standardized, u: `${P.changes_logged} edits`, segs: [["k", P.standardized, "var(--accent)", ""]]},
    {t: "환율 결합", n: P.fx_joined, u: `↶ ${S.length - sameDay}`, segs: [["k", sameDay, "var(--accent)", ""], ["p", S.length - sameDay, "var(--land-hover)", "↶"]]},
    {t: "수익 계산", n: won(DATA.summary.total_revenue), u: "KRW", segs: SVC.map(v => [v, S.filter(x => x.Service === v).length, SVC_COLOR[v], ""])},
  ];
  const host = $("#flow"), W = Math.max(560, host.clientWidth || 900), H = 230, top = 46, colH = 150, bw = 26;
  const sc = colH / P.collected, xs = cols.map((_, i) => 20 + (W - 40 - bw) * i / (cols.length - 1));
  const el = svg("svg", {class: "chart-svg", viewBox: `0 0 ${W} ${H}`, height: H, role: "img", "aria-label": "정제 자동화 흐름"});
  // 띠 (유지되는 흐름만)
  for (let i = 0; i < cols.length - 1; i++) {
    const keep = i === 0 ? P.collected : cols[i].segs.filter(sg => sg[0] !== "x").reduce((a, sg) => a + sg[1], 0);
    const nextKeep = i === 0 ? P.collected : keep;
    const x1 = xs[i] + bw, x2 = xs[i + 1], h1 = keep * sc, h2 = (i === 0 ? P.collected : nextKeep) * sc, mx = (x1 + x2) / 2;
    svg("path", {d: `M${x1},${top} C${mx},${top} ${mx},${top} ${x2},${top} L${x2},${top + h2} C${mx},${top + h2} ${mx},${top + h1} ${x1},${top + h1} Z`, fill: "var(--accent)", "fill-opacity": .1}, el);
  }
  cols.forEach((c, i) => {
    let y = top;
    c.segs.forEach(([key, n, col, lab]) => {
      const h = n * sc;
      const r = svg("rect", {x: xs[i], y: y + 1, width: bw, height: Math.max(1, h - 2), rx: 3, fill: col}, el);
      bindTip(r, `${c.t}`, [[key === "x" ? "중복 제거" : key === "p" ? "직전 고시일 환율" : SYS_KO[key] || SVC_KO[key] || "처리", `${n}`, col]]);
      if (lab && h > 14) { const t = svg("text", {x: xs[i] + bw + 5, y: y + h / 2 + 4, class: "val2"}, el); t.textContent = `${lab} ${n}`; }
      y += h;
    });
    const t1 = svg("text", {x: xs[i], y: 16, class: "ttl"}, el); t1.textContent = c.t;
    const t2 = svg("text", {x: xs[i], y: 36, class: "val num", "font-size": 18}, el); t2.textContent = typeof c.n === "number" ? c.n : c.n;
    const t3 = svg("text", {x: xs[i], y: top + colH + 22, class: "tick"}, el); t3.textContent = c.u;
  });
  host.replaceChildren(el);

  // 원본 형식 3종: 원문 그대로
  $("#fmt3").innerHTML = ["BRANCH", "DIGITAL", "CORP"].map(sys => {
    const ex = DATA.raw.find(r => r.system === sys && !r.duplicate);
    return `<div><div class="chips" style="margin-bottom:8px"><span class="dot" style="background:${SYS_COL[sys]};width:10px;height:10px"></span><b>${esc(SYS_KO[sys])}</b><span class="pill">${esc(ex.format)}</span><span class="pill">${fmtCnt(sys)}</span></div><pre class="raw-pre">${esc(ex.text)}</pre><div class="chips" style="margin-top:6px"><a href="#" class="chip std mono" data-txn="${esc(ex.transaction_id)}" style="text-decoration:none">→ ${esc(ex.transaction_id)}</a></div></div>`;
  }).join("");
  $("#fmt3").querySelectorAll("a[data-txn]").forEach(a => a.addEventListener("click", e => { e.preventDefault(); openDrill([{txn: a.dataset.txn}]); }));

  // 규칙: 변경 건수 막대 + 실제 예시 1건 (설명은 툴팁)
  const ruleRows = DATA.rules.filter(r => r.id !== "R10_REVENUE").map(r => {
    const n = r.id === "R00_DEDUP" ? P.duplicates.length : ruleCount(r.id);
    const ex = r.id === "R00_DEDUP" ? {raw: P.duplicates[0]?.file.split("/").pop(), clean: "✕"} : DATA.log.find(l => l.rule === r.id && String(l.raw).trim() !== String(l.clean));
    return {r, n, ex};
  }).sort((a, b) => b.n - a.n);
  const maxN = Math.max(...ruleRows.map(x => x.n), 1);
  $("#rules").innerHTML = `<div class="map-rows" style="grid-template-columns:64px 1fr auto 14px auto">${ruleRows.map(({r, n, ex}) =>
    `<span class="fl" title="${esc(r.rule)}">${RULE_KO[r.id]}</span><span title="${esc(r.rule)}" style="display:flex;align-items:center;gap:6px"><i style="display:block;height:12px;border-radius:3px;background:var(--accent);width:${Math.max(2, n / maxN * 100)}%"></i><b class="num" style="font-size:12px">${n}</b></span>` +
    (ex ? `<span class="chip raw">${esc(String(ex.raw).trim())}</span><span class="ar">→</span><span class="chip std">${esc(String(ex.clean))}</span>` : `<span></span><span></span><span></span>`)).join("")}</div>`;

  // 검증: 체크 타일
  const tile = (ok, big, label) => `<div><span class="ic ${ok ? "" : "bad"}">${ok ? "✓" : "✕"}</span><span><b class="num">${big}</b><small>${label}</small></span></div>`;
  $("#valid").innerHTML = `<div class="vt">
    ${tile(V.truth_mismatches.length === 0, `${V.truth_rows - V.truth_mismatches.length}/${V.truth_rows}`, "정답 일치")}
    ${tile(V.parse_issues.length === 0, `${V.parse_issues.length}`, "해석 실패")}
    ${tile(V.krw_identity_ok, "외화 × 환율", "= 원화")}
    ${tile(V.revenue_identity_ok, "Σ 수익", "= 수수료+외환+금융")}
  </div>
  <div class="chips" style="margin-top:12px">${P.duplicates.map(d => `<span class="chip raw">${esc(d.file.split("/").pop())}</span><span class="same">=</span><span class="chip">${esc(d.duplicate_of.split("/").pop())}</span>`).join('<span style="width:10px"></span>')}</div>`;
  renderDict(); renderLog();
}
function renderDict() {
  const dims = [["country", "국가"], ["currency", "통화"], ["service", "서비스"], ["customer_type", "고객유형"], ["channel", "채널"]];
  $("#dictSeg").innerHTML = dims.map(([k, l]) => `<button data-d="${k}" aria-pressed="${state.dict === k}">${l}</button>`).join("");
  $("#dictSeg").querySelectorAll("button").forEach(b => b.addEventListener("click", () => { state.dict = b.dataset.d; renderDict(); }));
  const used = {};
  const fieldOf = {country: "Country", currency: "Currency", service: "Service", customer_type: "Customer_Type", channel: "Channel"}[state.dict];
  for (const l of DATA.log) if (l.field === fieldOf) used[`${l.raw}`.trim()] = (used[`${l.raw}`.trim()] || 0) + 1;
  $("#dict").innerHTML = `<thead><tr><th>표준 값</th><th>한글</th><th>원본 별칭</th><th class="r">변경 기록</th></tr></thead><tbody>${Object.entries(DICT[state.dict]).map(([code, e]) => {
    const n = sum(e.aliases, a => used[a] || 0);
    return `<tr><td>${state.dict === "country" ? flagHtml(e.label) : ""}<b>${esc(e.label)}</b></td><td>${esc(e.ko)}</td><td style="white-space:normal">${e.aliases.map(a => `<span class="pill mono" style="margin:1px 2px">${esc(a)}</span>`).join("")}</td><td class="r num">${n}</td></tr>`;
  }).join("")}</tbody>`;
}
function renderLog() {
  const rules = [...new Set(DATA.log.map(l => l.rule))].sort();
  fillSelect("#logRule", [["all", "전체 규칙"], ...rules.map(r => [r, r])], state.logRule);
  const q = state.logQ.trim().toLowerCase();
  const rows = DATA.log.filter(l => (state.logRule === "all" || l.rule === state.logRule) && (!q || [l.raw, l.clean, l.file, l.Transaction_ID, l.field, l.note].join(" ").toLowerCase().includes(q)));
  const per = 60, pages = Math.max(1, Math.ceil(rows.length / per)); state.logPage = Math.min(state.logPage, pages - 1);
  const page = rows.slice(state.logPage * per, (state.logPage + 1) * per);
  $("#logSub").textContent = `${rows.length}`;
  const t = $("#log");
  t.innerHTML = `<thead><tr><th>거래번호</th><th>원본 파일</th><th>필드</th><th>원문</th><th></th><th>표준값</th><th>규칙</th><th>비고</th></tr></thead>`;
  const tb = document.createElement("tbody");
  for (const l of page) {
    const tr = document.createElement("tr"); tr.className = "click";
    tr.innerHTML = `<td class="mono">${esc(l.Transaction_ID || "-")}</td><td class="mono">${esc(l.file.replace("raw_slips/", ""))}</td><td>${esc(l.field)}</td><td class="mono" style="color:var(--warn-ink)">${esc(JSON.stringify(String(l.raw)))}</td><td class="same">→</td><td><b>${esc(l.clean)}</b></td><td class="mono">${esc(l.rule)}</td><td class="hint">${esc(l.note)}</td>`;
    if (l.Transaction_ID) tr.addEventListener("click", () => openDrill([{txn: l.Transaction_ID}]));
    tb.appendChild(tr);
  }
  t.appendChild(tb);
  $("#logPager").innerHTML = `<span>${state.logPage + 1} / ${pages}</span><button class="btn" id="lp" ${state.logPage ? "" : "disabled"}>이전</button><button class="btn" id="ln" ${state.logPage < pages - 1 ? "" : "disabled"}>다음</button>`;
  $("#lp").onclick = () => { state.logPage--; renderLog(); }; $("#ln").onclick = () => { state.logPage++; renderLog(); };
}

// ---------- BASIS: 배지 + 미니 차트 + 산식 블록 ----------
function renderBasis() {
  const fx = DATA.fx_meta, sim = fx.source === "SIMULATED", P = DATA.summary;
  $("#basisBadges").innerHTML = `<span class="badge" title="실제 고객정보 없음"><i></i>거래 SIMULATED</span><span class="badge ${sim ? "" : "ok"}" title="${esc(fx.note)}"><i></i>환율 ${sim ? "SIMULATED" : "ECOS"}</span><span class="badge" title="${esc(DATA.policy.basis)}"><i></i>수수료 가상 정책</span><span class="badge ok"><i></i>ISO 3166 · ISO 4217</span>`;
  $("#fxSrcLabel").textContent = `${fx.period.join(" ~ ")}`;
  const units = fx.quote_units;
  $("#fxGrid").innerHTML = Object.keys(DICT.currency).map(c => {
    const u = units[c] || 1, vals = MONTHS.map(m => (DATA.fx_monthly[m]?.[c] ?? NaN) * u);
    const first = vals[0], last = vals[vals.length - 1], r = (last - first) / first;
    const dig = last < 10 ? 2 : 2;

  out.about.push("분석에 쓰인 기준을 모아 둔 화면입니다. 데이터 성격 배지, 통화별 환율 추이, 서비스별 수수료·스프레드 정책, 데이터 구성, 핵심 계산식을 보여 줍니다.");
  const mv = Object.keys(DICT.currency).map(c => { const f = DATA.fx_monthly[MONTHS[0]]?.[c], l = DATA.fx_monthly[MONTHS[8]]?.[c]; return [c, f && l ? l / f - 1 : 0]; }).sort((x, y) => y[1] - x[1]);
  out.ins.push(`1월 대비 9월 평균 환율은 ${B(mv[0][0])}가 ${B("▲" + pct(mv[0][1], 1))}로 가장 많이 올랐고, ${B(mv[mv.length - 1][0])}가 ${B("▼" + pct(-mv[mv.length - 1][1], 1))}로 가장 많이 내렸습니다.`);
  const sp = Object.entries(DATA.policy.services["Retail FX"].cash_spread).sort((x, y) => y[1] - x[1]);
  out.ins.push(`환전 스프레드는 ${B(sp[0][0])} ${pct(sp[0][1], 2)}가 가장 높고 ${B(sp[sp.length - 1][0])} ${pct(sp[sp.length - 1][1], 2)}가 가장 낮습니다. 유통량이 적은 통화일수록 스프레드가 큽니다.`);
  out.ins.push(`해외송금은 전자금융 수수료가 영업점의 ${B("절반")}이고 우대율도 높아, 같은 금액이라도 모바일 거래의 건당 수익이 작습니다.`);
  out.ins.push(`무역금융 수익은 거래액 × 연 ${pct(DATA.policy.services["Trade Finance"].annual_margin, 1)} × 여신일수로 계산되어, 금액과 기간이 클수록 수익이 빠르게 커집니다.`);
  out.warn.push(`환율은 ${fx.source === "SIMULATED" ? B("시뮬레이션 값") + "입니다. ECOS 실제 환율로 교체하면 원화 거래액과 수익이 함께 바뀝니다" : "한국은행 ECOS 고시 값입니다"}.`);
  out.warn.push("수수료 정책은 공개 수수료 구조를 참고한 가상 정책으로, 특정 은행의 실제 요율이 아닙니다.");
  return out;
}
function aiDrill(path) {
  const last = path[path.length - 1], out = {about: [], ins: [], warn: [], act: []};
  if (last.raw) {
    const raw = RAW_BY_FILE[last.raw], s = BY_ID[raw.transaction_id], logs = LOG_BY_FILE[last.raw] || [];
    out.about.push(`드릴다운의 마지막 단계로, ${B(SYS_KO[raw.system])} 시스템이 만든 ${raw.format} 원본 파일을 수정 없이 보여 줍니다. 아래에서 각 항목이 어떤 규칙으로 표준값이 되었고 금액이 어떻게 계산되었는지 확인할 수 있습니다.`);
    if (!s) return out;
    const rules = [...new Set(logs.map(l => RULE_KO[l.rule]).filter(Boolean))];
    out.ins.push(`원본 ${rawFields(s).length}개 항목 중 ${B(logs.filter(l => l.field !== "FX_Rate_Date").length + "개")}의 값이 바뀌었습니다 (${rules.join(", ")}).`);
    const typo = logs.find(l => l.rule === "R08_TYPO");
    if (typo) out.ins.push(`오탈자 ${B(`"${String(typo.raw).trim()}" → ${typo.clean}`)}을 자동 교정했습니다.`);
    if (s.FX_Rate_Date !== s.Date) out.ins.push(`거래일 ${s.Date}은 환율 고시가 없는 날이라 ${B(s.FX_Rate_Date)} 환율을 적용했습니다.`);
    const parts = [["수수료", s.Fee], ["외환 수익", s.FX_Revenue], ["금융 수익", s.Finance_Revenue]].sort((x, y) => y[1] - x[1]);
    out.ins.push(`수익 ${B("₩" + n0(s.Total_Revenue))} 중 ${BJ(parts[0][0])} ${share(parts[0][1] / (s.Total_Revenue || 1))}를 차지합니다.`);
    if (DATA.summary.pipeline.duplicates.some(d => d.duplicate_of === last.raw)) out.warn.push("이 파일은 디지털 시스템이 한 번 더 보낸 재전송 파일이 있어, 중복 1건을 제거했습니다.");
    return out;
  }
  if (last.txn) {
    const s = BY_ID[last.txn], same = S.filter(x => x.Service === s.Service), avgRate = sum(same, "Total_Revenue") / sum(same, "KRW_Amount");
    const rank = [...S].sort((x, y) => y.KRW_Amount - x.KRW_Amount).findIndex(x => x.Transaction_ID === s.Transaction_ID) + 1;
    out.about.push(`거래 1건의 결과값과, 원본 표기가 표준값으로 어떻게 바뀌었는지를 나란히 보여 줍니다. ‘원본 전표’를 누르면 원본 파일과 계산 과정이 나옵니다.`);
    out.ins.push(`${flagHtml(s.Country)}${CTRY[s.Country].ko} ${SVC_KO[s.Service]} 거래로, 원화 ${B(won(s.KRW_Amount))}이며 전체 100건 중 거래액 ${B(rank + "위")}입니다.`);
    out.ins.push(`수익률 ${B(s.Revenue_Rate.toFixed(3) + "%")}는 같은 서비스 평균 ${pct(avgRate, 3)}보다 ${s.Revenue_Rate / 100 >= avgRate ? "높습니다" : "낮습니다"} (${CHAN_KO[s.Channel]} 채널).`);
    out.ins.push(`${SYS_KO[s.Source_System]} 시스템의 ${s.Source_Format} 원본에서 왔습니다.`);
    return out;
  }
  const dims = path.filter(p => p.dim), rows = sliceRows(), all = agg(rowsNow()), a = agg(rows);
  const name = dims.map(p => DIM[p.dim].label(p.value)).join(" · ");
  out.about.push(`${B(name)}만 떼어 본 화면입니다. 위 숫자는 이 범위의 합계이고, 아래 막대를 누르면 한 단계 더 내려갑니다. 거래 목록에서 개별 거래로 이동할 수 있습니다.`);
  if (!rows.length) return out;
  out.ins.push(`전체 거래액의 ${B(share(a.krw / (all.krw || 1)))}, 수익의 ${B(share(a.rev / (all.rev || 1)))}를 차지합니다 (${a.cnt}건).`);
  const diff = a.rate - all.rate;
  out.ins.push(`수익률 ${B(pct(a.rate, 3))}로 전체 평균보다 ${B(bp(Math.abs(diff)))} ${diff >= 0 ? "높습니다" : "낮습니다"}.`);
  for (const d of ["Service", "Country", "Channel", "Customer_Type"].filter(d => !dims.some(p => p.dim === d)).slice(0, 2)) {
    const t = topBy(rows, d);
    if (t.length) out.ins.push(`${DIM[d].ko} 기준으로는 ${d === "Country" ? flagHtml(t[0].k) : ""}${BJ(DIM[d].label(t[0].k))} 거래액의 ${share(t[0].v / a.krw)}입니다.`);
  }
  if (!dims.some(p => p.dim === "Month")) { const m = topBy(rows, "Month")[0]; out.ins.push(`거래액이 가장 큰 달은 ${B(+m.k.slice(5) + "월")} (${won(m.v)})입니다.`); }
  const big = [...rows].sort((x, y) => y.KRW_Amount - x.KRW_Amount)[0];
  out.ins.push(`가장 큰 거래는 ${B(big.Transaction_ID)} ${won(big.KRW_Amount)}으로, 이 범위 거래액의 ${share(big.KRW_Amount / a.krw)}입니다.`);
  if (big.KRW_Amount / a.krw > 0.4) out.warn.push("한 건이 이 범위 거래액의 40% 이상이라, 그 거래 하나에 따라 결과가 크게 달라집니다.");
  if (a.cnt < 5) out.warn.push(`거래가 ${a.cnt}건뿐이라 비율 해석에 주의가 필요합니다.`);
  return out;
}
function aiContext() {
  const open = $("#drawer").classList.contains("on") && state.path.length;
  if (open) {
    const last = state.path[state.path.length - 1];
    const ctx = last.raw ? "드릴다운 · 원본 전표" : last.txn ? "드릴다운 · 거래" : `드릴다운 · ${state.path.filter(p => p.dim).map(p => DIM[p.dim].ko).join(" › ")}`;
    return {title: last.raw ? "원본 전표 해설" : last.txn ? "거래 해설" : "드릴다운 해설", ctx, data: aiDrill(state.path)};
  }
  const T = {home: ["홈 대시보드 해설", aiHome], ledger: ["거래 원장 해설", aiLedger], pipeline: ["정제 자동화 해설", aiPipeline], basis: ["데이터 기준 해설", aiBasis]}[state.tab];
  return {title: T[0], ctx: state.tab === "home" || state.tab === "ledger" ? `${PERIODS.find(p => p[0] === state.f.period)[1]}${["Customer_Type", "Service", "Channel"].some(k => state.f[k] !== "all") ? " · 필터 적용" : ""}` : "전체 데이터", data: T[1]()};
}
function renderAI() {
  const {title, ctx, data} = aiContext();
  const html = [["이 화면은", data.about, ""], ["핵심 인사이트", data.ins, ""], ["주의할 점", data.warn, "warn"], ["제안", data.act, "act"]]
    .filter(([, items]) => items.length)
    .map(([h, items, cls]) => `<section class="ai-sec ${cls}"><h5>${h}</h5>${h === "이 화면은" ? items.map(t => `<p>${t}</p>`).join("") : `<ul>${items.map((t, i) => `<li data-i="${i + 1}">${t}</li>`).join("")}</ul>`}</section>`).join("");
  const key = title + ctx + html;
  $("#aiTitle").textContent = title; $("#aiCtx").textContent = ctx;
  if (key === AI.key) return;
  AI.key = key;
  const body = $("#aiBody"), panel = $("#aiPanel");
  clearTimeout(AI.timer);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) { body.innerHTML = html; return; }
  // 생성 중 표시 후 문단을 차례로 보여 준다
  panel.classList.add("busy");
  body.innerHTML = `<div class="ai-typing"><i></i><i></i><i></i></div>`;
  AI.timer = setTimeout(() => {
    panel.classList.remove("busy");
    body.innerHTML = html;
    [...body.querySelectorAll("p, li, h5")].forEach((el, i) => { el.classList.add("ai-reveal"); el.style.animationDelay = `${i * 70}ms`; });

}
function setAI(on) {

// ---------- render ----------
// ---------- LED 전광판: 상승 ▲ 빨강 / 하락 ▼ 파랑 (국내 증권 관례) ----------
function ledMove(cur, prev, fmt, dec = 1) {
  if (!isFinite(prev) || prev === 0) return `<span class="eq">NEW</span>`;
  const d = cur - prev, r = d / prev;
  if (Math.abs(r) < 0.00005) return `<span class="eq">━ ${(0).toFixed(dec)}%</span>`;
  const cls = d > 0 ? "up" : "dn", ar = d > 0 ? "▲" : "▼";
  // 작은 기준값에서 생기는 수천 % 대신 배수로 표시 (4배 이상)
  const rel = r >= 3 ? `${(1 + r).toFixed(1)}배` : `${d > 0 ? "+" : "−"}${Math.abs(r * 100).toFixed(dec)}%`;
  return `<span class="${cls}">${ar} ${fmt ? fmt(Math.abs(d)) + " " : ""}${rel}</span>`;
}
function renderTicker() {
  const L = DATA.fx_latest, units = DATA.fx_meta.quote_units, parts = [];
  const sep = `<span class="sep">◆</span>`;
  // 1) 환율: 고시 단위 그대로, 직전 고시일 대비
  parts.push(`<span class="sec">FX ${DATA.fx_meta.source === "SIMULATED" ? "SIM" : "ECOS"}</span>`);
  parts.push(Object.keys(DICT.currency).filter(c => L.rates[c] != null).map(c => {
    const q = L.rates[c], pv = L.prev[c], u = units[c] || 1;
    const f = v => v.toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
    return `<span class="it"><span class="nm">${c}${u !== 1 ? `(${u})` : ""}/KRW</span><span class="px">${f(q)}</span>${ledMove(q, pv, f, 2)}</span>`;
  }).join(sep));
  // 2) 국가·서비스: 월 하나를 고르면 전월 대비, 그 외에는 마지막 분기 vs 직전 분기
  //    (월별 표본이 적어 ±100% 같은 잡음이 크므로 기본은 분기 비교)
  const ms = periodMonths(), li = MONTHS.indexOf(ms[ms.length - 1]), base = baseRows();
  let curM, preM, lab;
  if (ms.length === 1) { curM = [MONTHS[li]]; preM = li > 0 ? [MONTHS[li - 1]] : []; lab = `${li + 1}M vs ${li}M`; }
  else { const q = Math.floor(li / 3); curM = MONTHS.slice(q * 3, q * 3 + 3); preM = q > 0 ? MONTHS.slice(q * 3 - 3, q * 3) : []; lab = `${q + 1}Q vs ${q}Q`; }
  if (preM.length) {
    const cur = base.filter(s => curM.includes(s.Month)), pre = base.filter(s => preM.includes(s.Month));
    const item = (icon, name, a, b) => `<span class="it">${icon}<span class="nm">${name}</span><span class="px">${won(a)}</span>${!a && b ? `<span class="eq">거래 없음</span>` : ledMove(a, b)}</span>`;
    parts.push(`<span class="sec">COUNTRY ${lab}</span>`);
    parts.push(CTRY_LIST.map(c => {
      const a = sum(cur.filter(s => s.Country === c), "KRW_Amount"), b = sum(pre.filter(s => s.Country === c), "KRW_Amount");
      return a || b ? item(flagHtml(c), esc(CTRY[c].ko), a, b) : "";
    }).filter(Boolean).join(sep));
    parts.push(`<span class="sec">REVENUE ${lab}</span>`);
    parts.push(SVC.map(v => {
      const a = sum(cur.filter(s => s.Service === v), "Total_Revenue"), b = sum(pre.filter(s => s.Service === v), "Total_Revenue");
      return a || b ? item("", SVC_KO[v], a, b) : "";
    }).filter(Boolean).join(sep));
    const A = agg(cur), B = agg(pre);
    parts.push(`<span class="sec">TOTAL ${lab}</span>`);
    parts.push([item("", "거래액", A.krw, B.krw), item("", "수익", A.rev, B.rev), `<span class="it"><span class="nm">건수</span><span class="px">${A.cnt}건</span>${ledMove(A.cnt, B.cnt)}</span>`].join(sep));
  }
  const one = parts.join(" ") + `<span class="sep">◆</span>`;
  const track = $("#ledTrack");
  track.innerHTML = one + one; // 두 번 이어 붙여 끊김 없이 순환
  $("#ledDate").textContent = `FX ${L.date.replace(/-/g, ".")} · ${DATA.fx_meta.source === "SIMULATED" ? "SIMULATED" : "ECOS"}`;
  requestAnimationFrame(() => { track.style.setProperty("--led-dur", Math.max(30, track.scrollWidth / 2 / 70) + "s"); });
}

function render() {
  const rows = rowsNow();
  const fl = [state.f.Customer_Type, state.f.Service, state.f.Channel].filter(v => v !== "all").length;
  $("#fMeta").textContent = `${rows.length}건`;
  renderSummary(rows);
  if (state.tab === "home") { renderMessages(rows); renderMap(rows); renderTrend(); renderService(rows); renderCustomer(rows); }
  if (state.tab === "ledger") renderLedger();
  renderTicker();
  if (AI.on) renderAI();
  if ($("#drawer").classList.contains("on")) renderDrawer();
}

try { const t = localStorage.getItem("bo-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

document.querySelectorAll(".skins button").forEach(b => b.addEventListener("click", () => { setSkin(b.dataset.skin); render(); }));
try { const k = localStorage.getItem("bo-skin"); if (k) setSkin(k); } catch (e) {}
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 120); });
if (DATA.avatar) { const im = document.createElement("img"); im.src = DATA.avatar; im.alt = "민승환"; document.querySelector(".profile .av").replaceChildren(im); }
initFilters();
render();
// 글꼴 로딩 후 지도 라벨 폭을 다시 재서 국기 위치를 맞춘다
document.fonts?.ready.then(() => { if (state.tab === "home") renderMap(rowsNow()); });
